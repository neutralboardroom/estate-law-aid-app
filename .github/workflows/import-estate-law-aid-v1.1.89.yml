name: Import exact Estate Law Aid v1.1.89 runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estate-law-aid-v1189-import
  cancel-in-progress: false

jobs:
  import-exact-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify, test, and import exact runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="estate-law-aid-v1.1.89-render-runtime.zip"
          expected="60c296a63cd976f42b458fa6050a2817109a320571545e508ef00ce50735f45f"

          if [ ! -f "$archive" ]; then
            echo "No transport archive remains; import is already complete or not yet uploaded."
            exit 0
          fi

          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"

          stage="$RUNNER_TEMP/estate-law-aid-v1.1.89"
          rm -rf "$stage"
          mkdir -p "$stage"
          unzip -q "$archive" -d "$stage"

          test "$(node -p "require('$stage/package.json').version")" = "1.1.89"
          test -f "$stage/server.js"
          test -f "$stage/index.html"
          test -f "$stage/render.yaml"
          node --check "$stage/server.js"
          grep -q "estatelawaid.com" "$stage/server.js"
          grep -q "a422481365008549d509c6945c30b987934622f9bad5a14c56c941ea776a5d29" "$stage/server.js"

          (
            cd "$stage"
            PORT=10000 node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
            pid=$!
            trap 'kill $pid 2>/dev/null || true' EXIT
            ready=false
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:10000/health > "$RUNNER_TEMP/health.json"; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
            node -e "const h=require(process.env.RUNNER_TEMP+'/health.json'); if(!h.ok||h.version!=='1.1.89'||h.app!=='Estate Law Aid'||h.sensitiveTrafficApproved!==false) process.exit(1)"
            curl -fsS http://127.0.0.1:10000/ > "$RUNNER_TEMP/home.html"
            grep -qi "Estate Law Aid" "$RUNNER_TEMP/home.html"
          )

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name "$archive" \
            -exec rm -rf {} +
          cp -a "$stage"/. .
          rm -f "$archive"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Import exact Estate Law Aid v1.1.89 production runtime"
          git push origin HEAD:main
