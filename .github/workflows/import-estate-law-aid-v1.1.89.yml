name: Import exact Estate Law Aid v1.3.4 runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estate-law-aid-v134-import
  cancel-in-progress: false

jobs:
  import-exact-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify, test, and import exact runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="ela-runtime-v134.tar.xz"
          expected_archive_sha="dc63c066ac3be50e8fba1caf7f4c07e3d617fda7709ef1e31a6bb55899fc3373"
          expected_source_sha="114ff2fee0d8709175a55cab31ac407d48b12525c855fd26b45d0a3e15c25923"

          if [ ! -f "$archive" ]; then
            test -f package.json
            test "$(node -p "require('./package.json').version")" = "1.3.4"
            node -e "const r=require('./SOURCE_ARTIFACT_BINDING.json');if(r.version!=='1.3.4'||r.sourceArtifactSha256!=='$expected_source_sha'||r.canonicalDomain!=='https://estatelawaid.com')process.exit(1)"
            echo "Exact v1.3.4 runtime is already imported; no transport archive remains."
            exit 0
          fi

          actual_archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_archive_sha" = "$expected_archive_sha"

          python - "$archive" <<'PY'
          import pathlib, sys, tarfile
          archive=sys.argv[1]
          with tarfile.open(archive, 'r:xz') as tf:
              members=tf.getmembers()
              for member in members:
                  p=pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'links are not allowed in runtime transport: {member.name}')
          PY

          stage="$RUNNER_TEMP/estate-law-aid-v1.3.4-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xJf "$archive" -C "$stage"

          test "$(find "$stage" -type f | wc -l | tr -d ' ')" = "2233"
          test "$(find "$stage" -type f -name '*.html' | wc -l | tr -d ' ')" = "2005"
          test "$(node -p "require('$stage/package.json').version")" = "1.3.4"
          node -e "const r=require('$stage/SOURCE_ARTIFACT_BINDING.json');if(r.version!=='1.3.4'||r.sourceArtifactFilename!=='estate-law-aid-v1.3.4.zip'||r.sourceArtifactSha256!=='$expected_source_sha'||r.sourceArtifactSizeBytes!==100083691||r.sourceArtifactEntries!==9658||r.canonicalDomain!=='https://estatelawaid.com')process.exit(1)"
          test -f "$stage/server.js"
          test -f "$stage/index.html"
          test -f "$stage/render.yaml"
          test -f "$stage/sitemap.xml"
          test -f "$stage/find-a-professional/index.html"
          node --check "$stage/server.js"
          grep -q "estatelawaid.com" "$stage/server.js"
          grep -q "$expected_source_sha" "$stage/server.js"
          grep -q "1,267 profiles" "$stage/find-a-professional/index.html"
          test -z "$(find "$stage" -type f -size +100M -print -quit)"

          (
            cd "$stage"
            PORT=10000 node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
            pid=$!
            trap 'kill $pid 2>/dev/null || true' EXIT
            ready=false
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:10000/health > "$RUNNER_TEMP/health.json"; then
                ready=true
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/server.log"
                exit 1
              fi
              sleep 1
            done
            test "$ready" = true
            node -e "const h=require(process.env.RUNNER_TEMP+'/health.json');if(!h.ok||h.app!=='Estate Law Aid'||h.version!=='1.3.4'||h.canonicalDomain!=='https://estatelawaid.com'||h.sourceArtifactSha256!=='$expected_source_sha'||h.publicStaticLive!==true||h.sensitiveTrafficApproved!==false||h.liveClaims!==false||h.liveBilling!==false||h.liveUploads!==false||h.externalAi!==false)process.exit(1)"

            curl -fsS http://127.0.0.1:10000/livez > "$RUNNER_TEMP/livez.json"
            node -e "const h=require(process.env.RUNNER_TEMP+'/livez.json');if(!h.ok||h.status!=='alive'||h.app!=='Estate Law Aid'||h.version!=='1.3.4')process.exit(1)"

            curl -fsS http://127.0.0.1:10000/ > "$RUNNER_TEMP/home.html"
            grep -qi "Estate Law Aid" "$RUNNER_TEMP/home.html"

            curl -fsS http://127.0.0.1:10000/find-a-professional/ > "$RUNNER_TEMP/professionals.html"
            grep -q "1,267 profiles" "$RUNNER_TEMP/professionals.html"

            api_status="$(curl -sS -o "$RUNNER_TEMP/api.json" -w '%{http_code}' http://127.0.0.1:10000/api/ai/estate-intake-readiness)"
            test "$api_status" = "503"
            node -e "const h=require(process.env.RUNNER_TEMP+'/api.json');if(h.ok!==false||h.state!=='closed_by_design'||h.version!=='1.3.4')process.exit(1)"
          )

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name "$archive" \
            -exec rm -rf {} +

          find "$stage" -mindepth 1 -maxdepth 1 -exec cp -a {} . \;
          rm -f "$archive"

          test -f package.json
          test "$(node -p "require('./package.json').version")" = "1.3.4"
          test -f server.js
          test -f index.html
          test -f render.yaml
          test -f SOURCE_ARTIFACT_BINDING.json
          test ! -f "$archive"
          test "$(find . -path './.git' -prune -o -path './.github' -prune -o -type f -print | wc -l | tr -d ' ')" = "2233"
          test "$(find . -path './.git' -prune -o -path './.github' -prune -o -type f -name '*.html' -print | wc -l | tr -d ' ')" = "2005"
          test -z "$(find . -path './.git' -prune -o -type f -size +100M -print -quit)"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes were staged."
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "Refusing to modify workflow files from inside GitHub Actions."
            exit 1
          fi
          git commit -m "Import exact Estate Law Aid v1.3.4 production runtime"
          git push origin HEAD:main
