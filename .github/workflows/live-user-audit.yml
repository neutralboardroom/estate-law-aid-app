name: Estate Law Aid live uncached user audit

on:
  push:
    branches: [audit/live-full-2026-08-04]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-law-aid-live-user-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Install isolated Playwright audit dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ela-live-audit"
          cd "$RUNNER_TEMP/ela-live-audit"
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/ela-live-audit/node_modules" >> "$GITHUB_ENV"

      - name: Install Chromium
        shell: bash
        run: npx --prefix "$RUNNER_TEMP/ela-live-audit" playwright install --with-deps chromium

      - name: Run read-only uncached production audit
        shell: bash
        env:
          AUDIT_BASE_URL: https://estatelawaid.com
        run: node .audit/live-user-audit.mjs

      - name: Upload exact audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-law-aid-live-user-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
